
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<title>NINE HUB | PIXEL SPACE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Press+Start+2P&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
    --sky: #7dd3fc;
    --blue: #38bdf8;
    --green: #61e294;
    --purple: #a78bfa;
    --txt: #e6f4ff;
    --muted: #9bbfe4;
    --bg: #080d1b;
    --panel: rgba(17,28,48,.94);
    --pix: 'Press Start 2P', monospace;
    --spring: cubic-bezier(.34,1.56,.64,1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    padding: 35px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Mitr', sans-serif;
    color: var(--txt);
    background:
        radial-gradient(ellipse at 50% 0%, #19355c 0%, transparent 55%),
        linear-gradient(145deg,#080d1b,#10172b 55%,#08152d);
    overflow-x: hidden;
}

/* BACKGROUND */

#spaceCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
}

.ambient {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .12;
    pointer-events: none;
    z-index: -1;
    animation: ambientMove 14s ease-in-out infinite alternate;
}

.ambient.one {
    background: #168cff;
    top: -200px;
    left: -180px;
}

.ambient.two {
    background: #764cff;
    right: -200px;
    bottom: -200px;
    animation-delay: -7s;
}

@keyframes ambientMove {
    from { transform: translate(0,0) scale(1); }
    to { transform: translate(100px,80px) scale(1.3); }
}

/* MAIN */

.container {
    width: 100%;
    max-width: 540px;
    padding: 28px;
    position: relative;
    background: rgba(17,28,48,.88);
    border: 1px solid rgba(125,211,252,.3);
    border-radius: 25px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        0 0 35px rgba(82,199,255,.08),
        inset 0 1px rgba(255,255,255,.08);
    animation: entrance .9s var(--spring) both;
}

@keyframes entrance {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.94);
        filter: blur(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

.pixel-decoration {
    position: absolute;
    width: 9px;
    height: 9px;
    background: var(--green);
    box-shadow: 9px 0 var(--green),0 9px var(--green);
    opacity: .8;
}

.top-left {
    top: 12px;
    left: 12px;
}

.bottom-right {
    bottom: 12px;
    right: 12px;
    background: var(--purple);
    box-shadow: 9px 0 var(--purple),0 9px var(--purple);
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 30px;
    animation: itemEntrance .8s .1s both;
}

.brand-title {
    display: inline-block;
    color: var(--sky);
    font-family: var(--pix);
    font-size: clamp(30px,8vw,43px);
    text-decoration: none;
    text-shadow: 4px 4px 0 #155080,0 0 25px #38bdf855;
    transition: .3s var(--spring);
}

.brand-title:hover {
    color: var(--green);
    transform: translateY(-5px) scale(1.04);
}

.subtitle {
    margin-top: 15px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-top: 17px;
    padding: 7px 14px;
    border: 1px solid #286c50;
    border-radius: 30px;
    background: #61e29412;
    color: var(--green);
    font-size: 12px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% { opacity: .25; }
}

/* FORM */

.section-title {
    color: var(--sky);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
}

.section-title::before {
    content: "■ ";
    color: var(--green);
    font-size: 10px;
}

label {
    display: block;
    color: #b5c9e1;
    font-size: 14px;
    margin-bottom: 9px;
}

textarea {
    display: block;
    width: 100%;
    height: 155px;
    padding: 15px;
    resize: vertical;
    background: #080f1d;
    border: 1px solid #304967;
    border-radius: 15px;
    color: var(--green);
    font-family: 'JetBrains Mono',monospace;
    font-size: 12px;
    line-height: 1.7;
    outline: none;
    transition: .3s;
}

textarea:focus {
    border-color: var(--sky);
    box-shadow: 0 0 20px #38bdf825;
}

textarea::placeholder {
    color: #526b86;
}

#codeOutput {
    color: var(--green);
    background: #0b1720;
}

/* ALL BUTTONS */

button,
.soc {
    position: relative;
    overflow: hidden;
    isolation: isolate;
}

/* Synchronized shine */

button::after,
.soc::after {
    content: "";
    position: absolute;
    z-index: 2;
    top: -30%;
    bottom: -30%;
    left: -70%;
    width: 35%;
    background: linear-gradient(
        100deg,
        transparent,
        rgba(255,255,255,.48),
        transparent
    );
    transform: skewX(-22deg);
    animation: commonShine 3.6s ease-in-out infinite;
    animation-delay: 0s;
    pointer-events: none;
}

@keyframes commonShine {
    0%,45% { left: -70%; }
    100% { left: 140%; }
}

button {
    width: 100%;
    padding: 16px;
    margin: 20px 0 28px;
    border: 1px solid #8bf0b1;
    border-radius: 15px;
    background: linear-gradient(135deg,#248c59,#176b49);
    color: white;
    font-family: 'Mitr',sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 #10442f,0 10px 25px #61e29420;
    transition:
        transform .3s var(--spring),
        box-shadow .3s,
        filter .3s;
    animation: itemEntrance .8s .3s both;
}

button:hover:not(:disabled),
.soc:hover {
    transform: translateY(-4px) scale(1.015);
    filter: brightness(1.15);
}

button:active:not(:disabled),
.soc:active {
    transform: translateY(3px) scale(.96);
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* CREDIT */

.divider {
    width: 100%;
    height: 2px;
    margin: 34px 0 27px;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--sky) 20%,
        var(--blue) 50%,
        var(--sky) 80%,

    );
    box-shadow: 0 0 14px #38bdf855;
}

.credit {

    border-radius: 23px;
    text-align: center;
    background: linear-gradient(
        160deg,
        rgba(24,46,92,.88),
        rgba(8,17,40,.94)
    );
    border: 1px solid rgba(125,211,252,.35);
    box-shadow:
        0 20px 45px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.08);
    animation: itemEntrance .9s .5s both;
}

.credit-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
}

.credit-head .px {
    font-family: var(--pix);
    font-size: 14px;
    color: #e0f2fe;
    text-shadow: 3px 3px 0 #075985,0 0 18px #38bdf899;
}

.credit-head em {
    font-style: normal;
    font-size: 13px;
    color: var(--muted);
}

.credit-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.soc {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 14px 9px;
    border-radius: 15px;
    font-family: var(--pix);
    font-size: 9px;
    color: white;
    text-decoration: none;
    border: 1px solid #e0f2fe;
    box-shadow: 0 5px 0 #050c22,0 10px 22px #38bdf833;
    transition: .3s var(--spring);
}

.soc svg {
    width: 19px;
    height: 19px;
    fill: currentColor;
    flex-shrink: 0;
}

.soc.tt {
    background: linear-gradient(180deg,#1e293b,#000);
    border-color: #22d3ee;
}

.soc.dc {
    background: linear-gradient(180deg,#7c8bff,#4752c4);
    border-color: #e0e7ff;
}

.soc .ext {
    font-family: monospace;
    font-size: 12px;
    opacity: .85;
}

.footer {
    text-align: center;
    margin-top: 22px;
    color: #738ba7;
    font-size: 11px;
    letter-spacing: 1px;
}

.footer span {
    color: var(--purple);
}

/* ENTRANCE */

@keyframes itemEntrance {
    from {
        opacity: 0;
        transform: translateY(22px);
        filter: blur(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* MOBILE */

@media (max-width: 480px) {
    body {
        padding: 25px 13px;
    }

    .container {
        padding: 21px 15px;
        max-width: 100%;
    }

    textarea {
        height: 140px;
    }

    .soc {
        font-size: 8px;
        gap: 6px;
        padding: 13px 6px;
    }
}

/* REDUCE MOTION */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>

<script>
/* =================================
   SPACE PARTICLES
================================= */

const canvas = document.getElementById("spaceCanvas");
const ctx = canvas.getContext("2d");

let width, height;
let particles = [];
let mouse = { x: -1000, y: -1000 };

function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createParticles();
}

function createParticles() {
    particles = [];

    const count = Math.min(
        120,
        Math.floor(width * height / 8500)
    );

    for (let i = 0; i < count; i++) {
        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + .5,
            vx: (Math.random() - .5) * .55,
            vy: (Math.random() - .5) * .55,
            alpha: Math.random() * .6 + .2
        });
    }
}

function animateSpace() {
    ctx.clearRect(0, 0, width, height);

    particles.forEach(p => {

        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Particles escape from the mouse
        if (distance < 115 && distance > 0) {
            const force = (115 - distance) / 115;

            p.vx += (dx / distance) * force * .13;
            p.vy += (dy / distance) * force * .13;
        }

        // Natural movement
        p.vx += (Math.random() - .5) * .012;
        p.vy += (Math.random() - .5) * .012;

        // Limit speed
        const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);

        if (speed > 1.6) {
            p.vx = p.vx / speed * 1.6;
            p.vy = p.vy / speed * 1.6;
        }

        p.x += p.vx;
        p.y += p.vy;

        // Friction
        p.vx *= .995;
        p.vy *= .995;

        // Wrap around screen
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;
        if (p.y < -10) p.y = height + 10;
        if (p.y > height + 10) p.y = -10;

        // Draw particle
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(160,220,255,${p.alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#38bdf8";
        ctx.fill();

    });

    ctx.shadowBlur = 0;

    requestAnimationFrame(animateSpace);
}

window.addEventListener("resize", resizeCanvas);

window.addEventListener("pointermove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("pointerleave", () => {
    mouse.x = -1000;
    mouse.y = -1000;
});

resizeCanvas();
animateSpace();


/* =================================
   CLICK SOUND
================================= */

let audioContext = null;

function playClickSound() {

    try {
        if (!audioContext) {
            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) return;

            audioContext = new AudioContextClass();
        }

        if (audioContext.state === "suspended") {
            audioContext.resume();
        }

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(
            750,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            420,
            audioContext.currentTime + .07
        );

        gain.gain.setValueAtTime(
            .10,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + .09
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(audioContext.currentTime + .1);

    } catch (error) {
        console.warn("Audio unavailable");
    }
}

// Sound on user clicks
document.addEventListener("click", playClickSound);


/* =================================
   LUA CONVERTER
================================= */

document.addEventListener("DOMContentLoaded", () => {

    const inputCode = document.getElementById("codeInput");
    const outputCode = document.getElementById("codeOutput");
    const convertBtn = document.getElementById("convertBtn");

    if (!convertBtn || !inputCode || !outputCode) return;

    convertBtn.addEventListener("click", async () => {

        const code = inputCode.value.trim();

        if (!code) {
            outputCode.value =
                "-- กรุณาวางโค้ด Lua ก่อนกดแปลง!";

            outputCode.style.color = "#ff6666";
            return;
        }

        const originalText = "✦ แปลงเป็น Loadstring ทันที";

        convertBtn.innerText = "กำลังอัปโหลด...";
        convertBtn.disabled = true;

        outputCode.value = "-- CONNECTING TO SERVER...";
        outputCode.style.color = "#52c7ff";

        try {

            const response = await fetch(
                "https://dpaste.com/api/v2/",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        content: code,
                        syntax: "lua",
                        expiry_days: "365"
                    })
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Server Error: " + response.status
                );
            }

            const rawUrl =
                (await response.text()).trim() + ".txt";

            // Validate the returned URL
            const parsedUrl = new URL(rawUrl);

            if (parsedUrl.hostname !== "dpaste.com" ||
                parsedUrl.protocol !== "https:") {
                throw new Error("Invalid upload URL");
            }

            const finalLoadstring =
                `loadstring(game:HttpGet("${rawUrl}"))()`;

            outputCode.value = finalLoadstring;
            outputCode.style.color = "#61e294";

            try {
                await navigator.clipboard.writeText(
                    finalLoadstring
                );

                convertBtn.innerText = "✓ คัดลอกแล้ว!";

            } catch (err) {
                convertBtn.innerText = "✓ แปลงสำเร็จ!";
            }

        } catch (error) {

            outputCode.value =
                "-- เกิดข้อผิดพลาด: " + error.message;

            outputCode.style.color = "#ff6666";
            convertBtn.innerText = "✕ เกิดข้อผิดพลาด";

        } finally {

            setTimeout(() => {
                convertBtn.innerText = originalText;
                convertBtn.disabled = false;
            }, 2000);

        }

    });

});
</script>
