
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nine | Lua Converter</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Kanit:wght@400;500;600;700&display=swap');

:root {
    --bg: #080d1b;
    --panel: #111c30;
    --panel2: #172943;
    --green: #61e294;
    --blue: #52c7ff;
    --purple: #a78bfa;
    --text: #e4f1ff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 35px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Kanit', sans-serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at 50% 0%, #19355c 0%, transparent 55%),
        linear-gradient(180deg, #080d1b, #10172b 60%, #080d1b);
    overflow-x: hidden;
}

/* Animated space background */

.space {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
}

.stars {
    position: absolute;
    inset: -100%;
    background-image:
        radial-gradient(2px 2px at 40px 60px, white 99%, transparent),
        radial-gradient(2px 2px at 120px 150px, #52c7ff 99%, transparent),
        radial-gradient(1px 1px at 200px 220px, white 99%, transparent),
        radial-gradient(2px 2px at 300px 100px, #61e294 99%, transparent),
        radial-gradient(1px 1px at 400px 300px, white 99%, transparent);
    background-size: 450px 350px;
    animation: starMove 65s linear infinite;
}

.stars.two {
    opacity: .35;
    transform: scale(1.5);
    animation-duration: 100s;
    animation-direction: reverse;
}

@keyframes starMove {
    from { transform: translateY(0); }
    to { transform: translateY(350px); }
}

/* Main container */

.container {
    width: 100%;
    max-width: 650px;
    position: relative;
    padding: 28px;
    background: rgba(17, 28, 48, .94);
    border: 3px solid #385578;
    box-shadow:
        0 0 0 4px #0a1323,
        0 0 30px rgba(82, 199, 255, .12),
        8px 8px 0 #060b15;
    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Pixel decorations */

.pixel-decoration {
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--green);
    box-shadow: 12px 0 var(--green), 0 12px var(--green);
    opacity: .8;
}

.top-left {
    top: -8px;
    left: -8px;
}

.bottom-right {
    bottom: 4px;
    right: 4px;
    background: var(--purple);
    box-shadow: 12px 0 var(--purple), 0 12px var(--purple);
}

/* Header */

.header {
    text-align: center;
    margin-bottom: 30px;
}

.brand-title {
    display: inline-block;
    color: var(--blue);
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(30px, 8vw, 46px);
    text-decoration: none;
    text-shadow:
        4px 4px 0 #155080,
        0 0 20px rgba(82, 199, 255, .5);
    transition: .2s;
    margin-bottom: 15px;
}

.brand-title:hover {
    color: var(--green);
    transform: translateY(-3px);
    text-shadow: 4px 4px 0 #247a49, 0 0 25px var(--green);
}

.subtitle {
    font-size: 12px;
    color: #8faac8;
    letter-spacing: 3px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 17px;
    padding: 7px 13px;
    border: 1px solid #286c50;
    background: rgba(97, 226, 148, .08);
    color: var(--green);
    font-size: 12px;
}

.status-dot {
    width: 7px;
    height: 7px;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% { opacity: .25; }
}

/* Section */

.section-title {
    color: var(--blue);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 9px;
}

.section-title::before {
    content: "■";
    color: var(--green);
    font-size: 10px;
}

label {
    display: block;
    color: #b5c9e1;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 9px;
}

textarea {
    display: block;
    width: 100%;
    height: 155px;
    padding: 15px;
    resize: vertical;
    background: #080f1d;
    border: 2px solid #304967;
    color: var(--green);
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    outline: none;
    transition: .25s;
}

textarea:focus {
    border-color: var(--blue);
    box-shadow: 0 0 15px rgba(82, 199, 255, .15);
}

textarea::placeholder {
    color: #526b86;
}

#codeOutput {
    color: var(--green);
    background: #0b1720;
}

/* Button */

button {
    width: 100%;
    padding: 17px 12px;
    margin: 20px 0 27px;
    border: 2px solid #8bf0b1;
    background: linear-gradient(135deg, #248c59, #176b49);
    color: white;
    font-family: 'Kanit', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 #10442f;
    transition: .15s;
}

button:hover:not(:disabled) {
    background: linear-gradient(135deg, #35b975, #21865a);
    box-shadow: 0 5px 0 #10442f, 0 0 20px rgba(97, 226, 148, .3);
    transform: translateY(-2px);
}

button:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #10442f;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* Footer */

.footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 18px;
    border-top: 1px solid #293d58;
    color: #738ba7;
    font-size: 11px;
    letter-spacing: 1px;
}

.footer span {
    color: var(--purple);
}

/* Responsive */

@media (max-width: 480px) {
    body {
        padding: 25px 13px;
    }

    .container {
        padding: 20px 15px;
    }

    textarea {
        height: 140px;
    }

    .subtitle {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="space">
    <div class="stars"></div>
    <div class="stars two"></div>
</div>

<div class="container">

    <div class="pixel-decoration top-left"></div>
    <div class="pixel-decoration bottom-right"></div>

    <header class="header">

        <a
            href="https://www.tiktok.com/@niine909?_r=1&_t=ZS-98iK298iT0U"
            target="_blank"
            rel="noopener noreferrer"
            class="brand-title"
        >nine</a>

        <p class="subtitle">PIXEL SPACE // LUA CONVERTER</p>

        <div class="status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>

    </header>

    <div class="section-title">SCRIPT INPUT</div>

    <label for="codeInput">วางโค้ด Lua ของคุณที่นี่:</label>

    <textarea
        id="codeInput"
        placeholder="-- วางสคริปต์ของคุณตรงนี้..."
    ></textarea>

    <button id="convertBtn" type="button">
        ✦ แปลงเป็น Loadstring ทันที
    </button>

    <div class="section-title">OUTPUT TERMINAL</div>

    <label for="codeOutput">ผลลัพธ์:</label>

    <textarea
        id="codeOutput"
        readonly
        placeholder="-- ผลลัพธ์จะแสดงที่นี่..."
    ></textarea>

    <footer class="footer">
        NINE HUB <span>◆</span> PIXEL SPACE
        <br>
        <span>POWERED BY NINE</span>
    </footer>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const inputCode = document.getElementById("codeInput");
    const outputCode = document.getElementById("codeOutput");
    const convertBtn = document.getElementById("convertBtn");

    if (!convertBtn || !inputCode || !outputCode) return;

    convertBtn.addEventListener("click", async () => {

        const code = inputCode.value.trim();

        if (!code) {
            outputCode.value = "-- กรุณาวางโค้ด Lua ก่อนกดแปลง!";
            outputCode.style.color = "#ff6666";
            return;
        }

        const originalBtnText = "✦ แปลงเป็น Loadstring ทันที";

        convertBtn.innerText = "กำลังอัปโหลด...";
        convertBtn.disabled = true;

        outputCode.value = "-- CONNECTING TO SERVER...";
        outputCode.style.color = "#52c7ff";

        try {

            const response = await fetch("https://dpaste.com/api/v2/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    content: code,
                    syntax: "lua",
                    expiry_days: "365"
                })
            });

            if (!response.ok) {
                throw new Error("Server Error: " + response.status);
            }

            const rawUrl = (await response.text()).trim() + ".txt";

            const finalLoadstring =
                `loadstring(game:HttpGet("${rawUrl}"))()`;

            outputCode.value = finalLoadstring;
            outputCode.style.color = "#61e294";

            try {
                await navigator.clipboard.writeText(finalLoadstring);
                convertBtn.innerText = "✓ คัดลอกแล้ว!";
            } catch (err) {
                convertBtn.innerText = "✓ แปลงสำเร็จ!";
            }

        } catch (error) {

            outputCode.value = "-- เกิดข้อผิดพลาด: " + error.message;
            outputCode.style.color = "#ff6666";

            convertBtn.innerText = "✕ เกิดข้อผิดพลาด";

        } finally {

            setTimeout(() => {
                convertBtn.innerText = originalBtnText;
                convertBtn.disabled = false;
            }, 2000);

        }

    });

});
</script>

</body>
</html>
