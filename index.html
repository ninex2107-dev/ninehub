<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nine</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .brand-title {
            color: #00a2ff;
            text-decoration: underline;
            font-size: 2.2rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .brand-title:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- หัวข้อ nine สีฟ้า ขีดเส้นใต้ พอกดแล้วเปิดไปที่ TikTok -->
    <a href="https://www.tiktok.com/@niine909?_r=1&_t=ZS-98iK298iT0U" target="_blank" class="brand-title">nine</a>

    <label for="codeInput">วางโค้ด Lua ของคุณที่นี่:</label>
    <textarea id="codeInput" placeholder="-- วางสคริปต์ของคุณตรงนี้..."></textarea>

    <button id="convertBtn" onclick="processConvert()">แปลงเป็น Loadstring ทันที</button>

    <label for="codeOutput">ผลลัพธ์ (คัดลอกไปรันได้เลย):</label>
    <textarea id="codeOutput" readonly placeholder="-- ลิงก์ Loadstring จะแสดงที่นี่"></textarea>

    <script>
    async function processConvert() {
        const inputCode = document.getElementById("codeInput");
        const outputCode = document.getElementById("codeOutput");
        const convertBtn = document.getElementById("convertBtn");

        const code = inputCode.value.trim();
        
        if (!code) {
            outputCode.value = "-- กรุณาวางโค้ด Lua ก่อนกดแปลง!";
            outputCode.style.color = "#ff4d4d";
            return;
        }

        const originalBtnText = convertBtn.innerText;
        convertBtn.innerText = "กำลังแปลงและอัปโหลด...";
        convertBtn.disabled = true;
        outputCode.value = "-- กำลังเชื่อมต่อเซิร์ฟเวอร์...";
        outputCode.style.color = "#66d9ef";

        try {
            const formData = new FormData();
            formData.append("content", code);
            formData.append("syntax", "lua");

            const response = await fetch("https://dpaste.com/api/v2/", {
                method: "POST",
                body: formData
            });

            if (response.ok) {
                const rawUrl = (await response.text()).trim() + ".txt";
                const finalLoadstring = `loadstring(game:HttpGet("${rawUrl}"))()`;
                
                outputCode.value = finalLoadstring;
                outputCode.style.color = "#4caf50";
                
                try {
                    await navigator.clipboard.writeText(finalLoadstring);
                    convertBtn.innerText = "คัดลอกแล้ว!";
                } catch (err) {
                    convertBtn.innerText = "แปลงสำเร็จ!";
                }
            } else {
                outputCode.value = `-- เซิร์ฟเวอร์ขัดข้อง (Code: ${response.status})`;
                outputCode.style.color = "#ff4d4d";
            }
        } catch (error) {
            outputCode.value = `-- เกิดข้อผิดพลาด: ${error.message}`;
            outputCode.style.color = "#ff4d4d";
        } finally {
            setTimeout(() => {
                convertBtn.innerText = originalBtnText;
                convertBtn.disabled = false;
            }, 2000);
        }
    }
    </script>
</body>
</html>
