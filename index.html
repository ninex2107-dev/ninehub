<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua to Loadstring (Auto Host)</title>
    <style>
        /* สไตล์เพื่อให้หน้าตาเหมือนในรูป */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #1e1e1e;
            color: #66d9ef;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        #codeOutput {
            color: #4caf50; /* สีเขียวสำหรับผลลัพธ์ */
        }
        button {
            width: 100%;
            background-color: #0d8aeb; /* สีฟ้าตามปุ่มในรูป */
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0b76cc;
        }
        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>Lua to Loadstring (Auto Host)</h2>

    <!-- กล่องใส่โค้ด (Input) -->
    <label for="codeInput">วางโค้ด Lua ของคุณที่นี่:</label>
    <textarea id="codeInput" placeholder="-- วางสคริปต์ของคุณตรงนี้..."></textarea>

    <!-- ปุ่มกดแปลง -->
    <button id="convertBtn">แปลงเป็น Loadstring ทันที</button>

    <!-- กล่องแสดงผล (Output) -->
    <label for="codeOutput">ผลลัพธ์ (คัดลอกไปรันได้เลย):</label>
    <textarea id="codeOutput" readonly placeholder="-- ลิงก์ Loadstring จะแสดงที่นี่"></textarea>

</body>
</html>
